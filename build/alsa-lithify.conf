
# ── added by Lithify (lithify build appends this to the bundle's alsa.conf) ──

# The speaker setting channels = "mono": librespot's two channels mixed, half of each, into both
# outputs. A single speaker then plays all of the music: with its Stereo/Mono switch on stereo it
# would play the left channel only, the right one going to the output for a second speaker. The
# argument is the output librespot uses otherwise (the setting `device`).
pcm.lithify_mono {
	@args [ SLAVE ]
	@args.SLAVE {
		type string
		default "plughw:0,0"
	}
	type route
	slave.pcm $SLAVE
	slave.channels 2
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
}
